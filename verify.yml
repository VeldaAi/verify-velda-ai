# Traefik dynamic configuration for verify.velda.ai — drop into
# /docker/traefik/config/verify.yml. Traefik's file provider watches that directory,
# so NO restart is needed (and none should be done).
#
# Port updated to 8094 on 2026-11-05: 8091 and 8092 are both taken on this host
# (8092 is Reviva QA's rangeserver.py). Everything else is as supplied by Jason.

http:
  routers:
    verify:
      rule: "Host(`verify.velda.ai`)"
      entryPoints: [websecure]
      service: verify
      tls:
        certResolver: letsencrypt
      middlewares: [verify-headers]
  middlewares:
    verify-headers:
      headers:
        stsSeconds: 31536000
  services:
    verify:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8094"
