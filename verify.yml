# Traefik dynamic configuration for verify.velda.ai — drop into
# /docker/traefik/config/verify.yml. Traefik's file provider watches that directory,
# so NO restart is needed (and none should be done).
#
# verify-site stays on 127.0.0.1:8094. Paid fulfillment stays on 127.0.0.1:8095.
# Ports 8090–8093 belong to other programs on this host and are not used here.

http:
  routers:
    verify:
      rule: "Host(`verify.velda.ai`)"
      entryPoints: [websecure]
      service: verify
      tls:
        certResolver: letsencrypt
      middlewares: [verify-headers]
    verify-fulfill:
      rule: "Host(`verify.velda.ai`) && (PathPrefix(`/api/stripe/`) || PathPrefix(`/access/`))"
      priority: 100
      entryPoints: [websecure]
      service: verify-fulfill
      tls:
        certResolver: letsencrypt
      middlewares: [verify-headers]
  middlewares:
    verify-headers:
      headers:
        stsSeconds: 31536000
  services:
    verify:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8094"
    verify-fulfill:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8095"
